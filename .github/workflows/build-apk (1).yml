name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add notification icon and permission
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp resources/ic_stat_drop.xml android/app/src/main/res/drawable/ic_stat_drop.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Generate app icons
        run: |
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          python3 - <<'PY'
          import os, math
          from PIL import Image, ImageDraw

          def bez(p0, p1, p2, p3, n=60):
              return [((1-t)**3*p0[0]+3*(1-t)**2*t*p1[0]+3*(1-t)*t*t*p2[0]+t**3*p3[0],
                       (1-t)**3*p0[1]+3*(1-t)**2*t*p1[1]+3*(1-t)*t*t*p2[1]+t**3*p3[1])
                      for t in [i/n for i in range(n+1)]]

          def drop_points():
              pts = bez((12,2.5),(15.5,6.9),(18,10.2),(18,13.5))
              pts += [(12+6*math.cos(math.radians(a)), 13.5+6*math.sin(math.radians(a))) for a in range(0,181,3)]
              pts += bez((6,13.5),(6,10.2),(8.5,6.9),(12,2.5))
              return pts

          def draw_drop(img, frac, color):
              S = img.size[0]
              h = S*frac; sc = h/17.0
              cx = S/2; cy = S/2
              pts = [(cx+(x-12)*sc, cy+(y-11)*sc) for x, y in drop_points()]
              ImageDraw.Draw(img).polygon(pts, fill=color)

          def render(size, kind):
              k = 4; S = size*k
              BLUE = (0, 122, 255, 255)
              if kind == "fg":
                  img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
                  draw_drop(img, 0.40, (255, 255, 255, 255))
              else:
                  img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
                  bg = Image.new("RGBA", (S, S), BLUE)
                  mask = Image.new("L", (S, S), 0)
                  d = ImageDraw.Draw(mask)
                  if kind == "round":
                      d.ellipse((0, 0, S-1, S-1), fill=255)
                  else:
                      d.rounded_rectangle((0, 0, S-1, S-1), radius=int(S*0.22), fill=255)
                  img.paste(bg, (0, 0), mask)
                  draw_drop(img, 0.56, (255, 255, 255, 255))
              return img.resize((size, size), Image.LANCZOS)

          res = "android/app/src/main/res"
          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, s in legacy.items():
              out = f"{res}/mipmap-{d}"
              os.makedirs(out, exist_ok=True)
              render(s, "square").save(f"{out}/ic_launcher.png")
              render(s, "round").save(f"{out}/ic_launcher_round.png")
              render(int(s*2.25), "fg").save(f"{out}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/ic_launcher_background.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#007AFF</color>\n</resources>\n')
          print("icons done")
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: water-intake-logger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
